<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio - TRANSPORTESAQP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap" />
    <h:outputStylesheet name="css/estilo.css" />
  </h:head>

  <h:body styleClass="fondo-hero">
    <div class="container-fluid">
      <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-7 col-lg-6 text-center text-white anim-subir" style="position: relative; z-index: 2;">
          <div class="login-logo mb-4"><i class="bi bi-truck-front-fill"></i></div>
          <h1 class="display-4 fw-bold mb-3">Bienvenido a TRANSPORTESAQP</h1>
          <p class="lead mb-4 px-3" style="color: rgba(255,255,255,0.85);">
            Sistema integrado de gestión de transportes con arquitectura
            <span class="text-warning fw-semibold">MVC · DAO · DTO</span>
          </p>

          <h:form>
            <h:commandLink action="login.xhtml" styleClass="btn btn-dorado btn-lg px-4">
              <i class="bi bi-box-arrow-in-right"></i> Ir al Login
            </h:commandLink>
          </h:form>

          <div class="mt-5 anim-aparecer delay-3">
            <p class="small text-uppercase" style="letter-spacing: 2px; color: rgba(255,255,255,0.6);">Tecnologías utilizadas</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <span class="badge rounded-pill bg-light text-dark px-3 py-2">Java EE</span>
              <span class="badge rounded-pill bg-light text-dark px-3 py-2">JSF</span>
              <span class="badge rounded-pill bg-light text-dark px-3 py-2">Bootstrap</span>
              <span class="badge rounded-pill bg-light text-dark px-3 py-2">PostgreSQL</span>
              <span class="badge rounded-pill bg-light text-dark px-3 py-2">JDBC</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </h:body>
</html>
