<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <ui:composition template="WEB-INF/template.xhtml">
    <ui:define name="title">Gestión de Clientes - TRANSPORTESAQP</ui:define>

    <ui:define name="content">
      <div class="card anim-subir">
        <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
          <h4 class="mb-0"><i class="bi bi-people-fill"></i> Lista de Clientes</h4>
          <h:form>
            <h:commandLink action="#{clienteBean.nuevoCliente}" styleClass="btn btn-dorado btn-sm">
              <i class="bi bi-plus-circle"></i> Nuevo Cliente
            </h:commandLink>
          </h:form>
        </div>

        <h:messages globalOnly="true" layout="list"
                    styleClass="list-unstyled m-3 mb-0"
                    infoClass="alert alert-success"
                    warnClass="alert alert-warning"
                    errorClass="alert alert-danger" />

        <div class="card-body p-0">
          <div class="table-responsive">
            <h:dataTable value="#{clienteBean.clientes}" var="cliente"
                         styleClass="table table-hover align-middle mb-0"
                         headerClass="text-nowrap">
              <h:column>
                <f:facet name="header"><h:outputText value="Código" /></f:facet>
                <span class="badge bg-secondary">#{cliente.codigo}</span>
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Nombres" /></f:facet>
                <h:outputText value="#{cliente.nombres}" />
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Apellidos" /></f:facet>
                <h:outputText value="#{cliente.apellidos}" />
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Sexo" /></f:facet>
                <h:outputText value="#{cliente.sexo}" />
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Correo" /></f:facet>
                <h:outputText value="#{cliente.correo}" />
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Celular" /></f:facet>
                <h:outputText value="#{cliente.celular}" />
              </h:column>

              <h:column>
                <f:facet name="header"><h:outputText value="Acciones" /></f:facet>
                <h:form style="display: inline">
                  <h:commandLink action="#{clienteBean.editarCliente(cliente)}"
                                 styleClass="btn btn-outline-primary btn-sm me-1" title="Editar">
                    <i class="bi bi-pencil-square"></i>
                  </h:commandLink>
                  <h:commandLink action="#{clienteBean.eliminarCliente(cliente.codigo)}"
                                 styleClass="btn btn-outline-danger btn-sm" title="Eliminar"
                                 onclick="return confirm('¿Está seguro de eliminar este cliente?');">
                    <i class="bi bi-trash"></i>
                  </h:commandLink>
                </h:form>
              </h:column>
            </h:dataTable>
          </div>
        </div>

        <div class="card-footer bg-white text-muted small">
          Total de clientes registrados: <strong>#{clienteBean.clientes.size()}</strong>
        </div>
      </div>
    </ui:define>
  </ui:composition>
</html>
