<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - TRANSPORTESAQP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap" />
    <h:outputStylesheet name="css/estilo.css" />
  </h:head>

  <h:body styleClass="fondo-hero d-flex align-items-center justify-content-center">
    <div class="login-container anim-escala">
      <div class="text-center mb-4">
        <div class="login-logo"><i class="bi bi-truck-front-fill"></i></div>
        <h1 class="h3 mb-1" style="color: var(--azul-profundo);">TRANSPORTESAQP</h1>
        <p class="text-muted small mb-0">Sistema de Gestión de Transportes</p>
      </div>

      <h:form>
        <h:messages globalOnly="true" layout="list"
                    styleClass="list-unstyled mb-3"
                    infoClass="alert alert-success py-2"
                    warnClass="alert alert-warning py-2"
                    errorClass="alert alert-danger py-2" />

        <div class="mb-3">
          <h:outputLabel for="usuario" value="Usuario" styleClass="form-label" />
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <h:inputText id="usuario" value="#{loginBean.usuario}" styleClass="form-control"
                         placeholder="Ingrese su usuario" required="true" />
          </div>
        </div>

        <div class="mb-4">
          <h:outputLabel for="contrasena" value="Contraseña" styleClass="form-label" />
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <h:inputSecret id="contrasena" value="#{loginBean.contrasena}" styleClass="form-control"
                           placeholder="Ingrese su contraseña" required="true" />
          </div>
        </div>

        <div class="d-grid">
          <h:commandButton value="Iniciar Sesión" action="#{loginBean.autenticar}"
                           styleClass="btn btn-azul btn-lg" />
        </div>
      </h:form>

      <hr class="my-4" />
      <p class="text-center text-muted small mb-0">Versión 2.0 — 2026</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </h:body>
</html>
