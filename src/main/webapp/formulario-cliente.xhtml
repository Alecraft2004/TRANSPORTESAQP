<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <ui:composition template="WEB-INF/template.xhtml">
    <ui:define name="title">Formulario de Clientes - TRANSPORTESAQP</ui:define>

    <ui:define name="content">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">
          <div class="card anim-subir">
            <div class="card-header card-header-custom">
              <h4 class="mb-0">
                <i class="bi bi-person-vcard"></i>
                #{clienteBean.cliente.codigo == 0 ? 'Registrar Nuevo Cliente' : 'Editar Cliente'}
              </h4>
            </div>

            <div class="card-body p-4">
              <h:form>
                <h:messages globalOnly="true" layout="list"
                            styleClass="list-unstyled mb-3"
                            infoClass="alert alert-success"
                            warnClass="alert alert-warning"
                            errorClass="alert alert-danger" />

                <div class="row g-3">
                  <div class="col-md-6">
                    <h:outputLabel for="nombres" value="Nombres" styleClass="form-label" />
                    <h:inputText id="nombres" value="#{clienteBean.cliente.nombres}"
                                 styleClass="form-control" required="true"
                                 placeholder="Ingrese los nombres" />
                  </div>

                  <div class="col-md-6">
                    <h:outputLabel for="apellidos" value="Apellidos" styleClass="form-label" />
                    <h:inputText id="apellidos" value="#{clienteBean.cliente.apellidos}"
                                 styleClass="form-control" required="true"
                                 placeholder="Ingrese los apellidos" />
                  </div>

                  <div class="col-12">
                    <h:outputLabel for="direccion" value="Dirección" styleClass="form-label" />
                    <h:inputText id="direccion" value="#{clienteBean.cliente.direccion}"
                                 styleClass="form-control" placeholder="Ingrese la dirección" />
                  </div>

                  <div class="col-md-6">
                    <h:outputLabel for="correo" value="Correo" styleClass="form-label" />
                    <h:inputText id="correo" value="#{clienteBean.cliente.correo}"
                                 styleClass="form-control" placeholder="correo@ejemplo.com" />
                  </div>

                  <div class="col-md-6">
                    <h:outputLabel for="celular" value="Celular" styleClass="form-label" />
                    <h:inputText id="celular" value="#{clienteBean.cliente.celular}"
                                 styleClass="form-control" placeholder="Solo números" />
                  </div>

                  <div class="col-12">
                    <h:outputLabel value="Sexo" styleClass="form-label d-block" />
                    <h:selectOneRadio id="sexo" value="#{clienteBean.cliente.sexo}"
                                      styleClass="d-inline-flex gap-4">
                      <f:selectItem itemValue="M" itemLabel="Masculino" />
                      <f:selectItem itemValue="F" itemLabel="Femenino" />
                    </h:selectOneRadio>
                  </div>
                </div>

                <hr class="my-4" />

                <div class="d-flex justify-content-end gap-2">
                  <h:commandLink action="clientes.xhtml" styleClass="btn btn-outline-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                  </h:commandLink>
                  <h:commandButton action="#{clienteBean.guardarCliente()}" styleClass="btn btn-azul"
                                   value="Guardar" />
                </div>
              </h:form>
            </div>
          </div>
        </div>
      </div>
    </ui:define>
  </ui:composition>
</html>
